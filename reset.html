{% extends "base.html" %}
{% block title %}Nova senha — Artifex{% endblock %}
{% block content %}
<div class="auth-box panel">
  <h1>Criar nova senha</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span>Nova senha</span><input type="password" name="password" autocomplete="new-password" minlength="10" required autofocus><span class="hint">Mínimo de 10 caracteres.</span></label>
    <label class="field"><span>Repita a senha</span><input type="password" name="password2" autocomplete="new-password" required></label>
    <button class="btn btn-gold btn-block" type="submit">Salvar nova senha</button>
  </form>
</div>
{% endblock %}
